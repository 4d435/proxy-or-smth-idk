<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy Browser</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; background: #121212; }
        .address-bar { display: flex; gap: 8px; padding: 12px; background: #1e1e1e; }
        input { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; outline: none; }
        button { padding: 10px 20px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #4f46e5; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: white; }
    </style>
</head>
<body>
    <div class="address-bar">
        <input type="text" id="urlInput" placeholder="Enter website URL (e.g., example.com)" onkeydown="if(event.key==='Enter') loadPage()">
        <button onclick="loadPage()">Go</button>
    </div>
    <iframe id="browserFrame"></iframe>

    <script>
        function loadPage() {
            let input = document.getElementById('urlInput').value.trim();
            if (!input) return;

            if (!input.startsWith('http://') && !input.startsWith('https://')) {
                input = 'https://' + input;
            }

            document.getElementById('browserFrame').src = '/proxy?url=' + encodeURIComponent(input);
        }
    </script>
</body>
</html>
